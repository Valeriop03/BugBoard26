services:
  postgres-tests:
    image: postgres:16
    environment:
      POSTGRES_DB: bugboard26_tests
      POSTGRES_USER: bugboard26_tests
      POSTGRES_PASSWORD: bugboard26_tests
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugboard26_tests -d bugboard26_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
