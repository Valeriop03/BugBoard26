<div class="app-shell">
  @if (!isLoginPage) {
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" routerLink="/issues">BugBoard26</a>
      <nav class="nav">
        <a routerLink="/issues" routerLinkActive="active">Issue</a>
        <a routerLink="/issues/archived" routerLinkActive="active">Archivio</a>
        <a routerLink="/notifications" routerLinkActive="active">Notifiche</a>
        <a routerLink="/users" routerLinkActive="active">Utenti</a>
      </nav>
    </div>

    <div class="session">
      @if (currentUser) {
        <span class="role">{{ currentUser.role }}</span>
        <span class="email">{{ currentUser.email }}</span>
      }
      <button class="logout" type="button" (click)="logout()">Logout</button>
    </div>
  </header>
  }

  <main class="page" [class.login-page-wrapper]="isLoginPage">
    <router-outlet />
  </main>
</div>
