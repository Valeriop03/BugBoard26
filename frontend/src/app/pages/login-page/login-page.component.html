<section class="login-page">
  <aside class="intro">
    <h1>BugBoard26</h1>
    <p>Piattaforma per la gestione collaborativa delle issue nei progetti</p>
  </aside>

  <div class="panel">
    <h2>Accesso al sistema</h2>
    <form class="form" (ngSubmit)="login()">
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" placeholder="admin@bugboard26.local" required>
      </label>

      <label>
        Password
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required>
      </label>

      @if (errorMessage) {
        <p class="error">Le credenziali inserite non sono valide</p>
      }

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Accesso...' : 'Entra' }}
      </button>
    </form>
  </div>
</section>
